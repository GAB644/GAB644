<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../rsser.png">
    <title>RSSser</title>
    <link href="https://2014.oldgoogleskin.pages.dev/style.css" rel="stylesheet" type="text/css" />
    <style>
      .header {
        box-sizing: border-box;
        min-height: 88px;
        margin: 0 -8px;
        padding: 0 36px;
        border-bottom: 1px solid #ddd;
        background: #f1f1f1;
        overflow: hidden;
      }

      .google-logo {
        display: block;
        float: left;
        width: 162px;
        height: 48px;
        margin: 20px 0;
      }

      .google-logo img {
        display: block;
        width: 130px;
        height: auto;
        max-width: 100%;
        mix-blend-mode: multiply;
      }

      .search-form {
        float: left;
        width: calc(100% - 366px);
        height: 34px;
        margin: 27px 0 0 44px;
        overflow: hidden;
      }

      .search-field {
        position: relative;
        float: left;
        width: calc(100% - 104px);
      }

      .search-field input {
        box-sizing: border-box;
        display: block;
        width: 100%;
        height: 34px;
        padding: 0 36px 0 11px;
        border: 1px solid #ccc;
        border-radius: 0;
        background: #fff;
        color: #555;
        font: 18px Arial, sans-serif;
        outline: none;
      }

      .search-field input:focus {
        border-color: #9ab4e8;
      }

      .dropdown-arrow {
        position: absolute;
        top: 50%;
        right: 7px;
        width: 0;
        height: 0;
        margin-top: -2px;
        border-top: 5px solid #777;
        border-right: 5px solid transparent;
        border-left: 5px solid transparent;
        pointer-events: none;
      }

      .search-butt {
        box-sizing: border-box;
        display: block;
        float: right;
        width: 86px;
        height: 34px;
        padding: 0;
        border: 1px solid #5682ec;
        border-radius: 2px;
        background: #608EFA;
        background: -webkit-linear-gradient(180deg, rgba(96, 142, 250, 1) 0%, rgba(86, 130, 236, 1) 100%);
        background: -moz-linear-gradient(180deg, rgba(96, 142, 250, 1) 0%, rgba(86, 130, 236, 1) 100%);
        background: linear-gradient(180deg, rgba(96, 142, 250, 1) 0%, rgba(86, 130, 236, 1) 100%);
        filter: progid:DXImageTransform.Microsoft.gradient(startColorstr="#608EFA", endColorstr="#5682EC", GradientType=0);
        line-height: 30px;
        text-align: center;
        cursor: pointer;
      }

      .search-butt:hover {
        background: #5682ec;
      }

      .search-butt img {
        vertical-align: middle;
        width: 18px;
        height: 18px;
      }

      .account {
        float: right;
        width: 160px;
        margin-top: 37px;
        color: #555 !important;
        text-decoration: none;
        font: 14px Arial, sans-serif;
        text-align: right;
        white-space: nowrap;
      }

      .account .dropdown-arrow {
        position: static;
        display: inline-block;
        margin-left: 7px;
        vertical-align: middle;
      }

      @media (max-width: 720px) {
        .header {
          position: relative;
          padding: 14px 18px;
          min-height: 112px;
        }

        .google-logo {
          float: none;
          height: 48px;
          margin: 0;
        }

        .search-form {
          float: none;
          clear: both;
          width: 100%;
          margin: 12px 0 0;
        }

        .account {
          position: absolute;
          top: 30px;
          right: 18px;
          float: none;
          width: auto;
          margin: 0;
        }

        .search-butt {
          width: 56px;
        }

        .search-field {
          width: calc(100% - 74px);
        }
      }
    </style>
</head>
<body>

    <a style="font-family: 'Roboto';" href="soon.txt" class="more">More ▾</a>
  </div>
  <div class="header">
    <a class="google-logo" href="../index.html">
      <img src="../logo11w.png" alt="Goog">
    </a>
    <form class="search-form" role="search" action="#" method="get">

        <input type="search" name="q" placeholder="Search RSSser">

      <span>test@pmail.com</span>

</div>
