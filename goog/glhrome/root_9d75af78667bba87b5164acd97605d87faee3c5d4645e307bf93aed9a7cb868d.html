  <script>
    const BASE_PROFILE_URL = 'https://web.archive.org/web/20220321201651/https://developers.google.com/community/experts/directory/profile/profile-';
    const DEFAULT_AVATAR_URL = 'https://web.archive.org/web/20220321201651/https://www.gstatic.com/images/branding/product/2x/avatar_anonymous_120dp.png';

    class Experts {
      constructor({container, dataUrl, limit}) {
        this.container = document.querySelector(container);
        this.dataUrl = dataUrl;

        if (this.container && this.dataUrl) {
          this.limit = limit || 4;
          this.setup();
        }
      }

      async setup() {
        try {
          const response = await fetch(this.dataUrl);
          const data = await response.json();
          this.data = data.data;
          this.render();
        } catch(error) {
          this.container.innerHTML = `
            <div class="devsite-directory__error">
              <aside class="warning">
                <b>Error:</b> There was an error while loading the directory data.
              </aside>
            </div>
          `;
          this.container.style.display = 'block';
          console.error('Error while loading data: ', error);
        }
      }

      render() {
        let html = '';
        const items = this.randomItems();
        for (const item of items) {
          const {category, fullName, location} = item;
          let photoUrl = item.photoUrl;
          if (!photoUrl) {
            photoUrl = DEFAULT_AVATAR_URL;
          }
          const linkUrl = this.linkify(fullName);

          html += `
            <div class="devsite-directory__content__item">
              <div class="experts-directory__item devsite-card">
                <div class="experts-directory__item__profile">
                  <div class="experts-directory__item__profile-pic-holder"
                       style="background-image: url('${photoUrl}')">
                  </div>
                  <h3 class="experts-directory__item__name">
                    ${fullName}
                  </h3>
                  <p class="experts-directory__item__location">
                    ${location}
                  </p>
                  <p class="experts-directory__item__skills">
                    <span>Expertise: </span>
                    <br>
                    <span class="experts-directory__item__expertise">${category.replaceAll(',', ', ')}</span>
                  </p>
                </div>
                <div class="experts-directory__item__view-profile">
                  <a href="${linkUrl}" target="_top"
                        class="button button-white">
                        View Profile
                    </a>
                </div>
              </div>
            </div>
          `;
        }

        this.container.innerHTML = html;
      }

      randomItems() {
        const chosenAtRandom = [];
        for (let i = 0; i < this.limit; i++) {
          const randomIndex = Math.floor(Math.random() * this.data.length);
          chosenAtRandom.push(this.data[randomIndex]);
          this.data.splice(this.data.indexOf(randomIndex-1), 1);
        }
        return chosenAtRandom;
      }

      linkify(name) {
        const slug = name.toLowerCase().replace(/\s+/g, '-');
        return BASE_PROFILE_URL + encodeURIComponent(slug).replace(/\%/g, '-');
      }
    }

    new Experts({
      container: '.devsite-directory__content',
      dataUrl: '/community/experts/directory/directory.json',
    });
  </script>
